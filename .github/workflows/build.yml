name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build
        run: dotnet build LasteastPartition.sln -c Release
      - name: Unit tests
        run: dotnet run --project tests/Lasteast.Tests -c Release --no-build
      - name: Integration tests (real VHDX disks, admin)
        run: dotnet run --project tests/Lasteast.IntegrationTests -c Release --no-build
      - name: Read-only inventory of the runner's disks
        run: dotnet run --project src/Lasteast.Cli -c Release --no-build -- inventory
