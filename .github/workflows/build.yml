name: build
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build LasteastPartition.sln -c Release
      - run: dotnet run --project tests/Lasteast.Tests -c Release
      # Read-only smoke test of real detection on the CI runner's disks
      - run: dotnet run --project src/Lasteast.Cli -c Release -- inventory
